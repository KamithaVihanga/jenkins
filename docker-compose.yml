services:
  jenkins:
    build: .
    image: local/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"     # web UI
      - "50000:50000"   # inbound agents
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"  # lets the jenkins user use the host's Docker socket

volumes:
  jenkins_home: